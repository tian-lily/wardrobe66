<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wardrobe 66 — Digital Wardrobe & Outfit Studio</title>

<!-- Home-screen app (iOS Safari + Android) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wardrobe 66">
<meta name="theme-color" content="#F7F5F1">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ============================================================
   WARDROBE 66 — design tokens
   Paper #F7F5F1 · Stone #E4E0D8 · Ash #8C877D · Ink #1C1A17
   Clay #7A6A55 · Sage #6E7A63 · Amber #B0863C · Brick #9C4F3E
   ============================================================ */
:root{
  --paper:#F7F5F1; --chalk:#FFFFFF; --stone:#E4E0D8; --stone-2:#EFEBE4;
  --ash:#8C877D; --ash-2:#B4AFA5; --ink:#1C1A17; --ink-2:#3A3630;
  --clay:#7A6A55; --clay-soft:#EDE6DA;
  --sage:#6E7A63; --amber:#B0863C; --brick:#9C4F3E;
  --r:4px; --r-lg:10px;
  --shadow:0 1px 2px rgba(28,26,23,.04), 0 8px 24px -12px rgba(28,26,23,.14);
  --rail:78px;
  --display:"Didot","Bodoni MT","Playfair Display","Hoefler Text",Georgia,"Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
/* Full-screen home-screen app: keep content clear of the notch and home bar */
@supports(padding:max(0px)){
  .wrap{padding-top:max(34px, calc(env(safe-area-inset-top) + 14px))}
  .rail{padding-left:env(safe-area-inset-left)}
}
html{background:var(--paper)}
body{overscroll-behavior-y:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-left:var(--rail);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
::selection{background:var(--clay);color:#fff}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:2px}

/* ---------- typographic utilities ---------- */
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ash);font-weight:600}
.serif{font-family:var(--display)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:lang(zh) .eyebrow{letter-spacing:.14em}

/* ---------- left rail (desktop) ---------- */
.rail{
  position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:40;
  background:var(--chalk);border-right:1px solid var(--stone);
  display:flex;flex-direction:column;align-items:center;padding:18px 0 16px;
}
.mark{
  writing-mode:vertical-rl;text-orientation:mixed;font-family:var(--display);
  font-size:17px;letter-spacing:.34em;text-transform:uppercase;margin-top:6px;
  color:var(--ink);user-select:none;
}
.mark b{font-weight:400;font-style:italic}
.rail-nav{margin-top:auto;margin-bottom:auto;display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.rnav{
  width:52px;height:52px;border-radius:var(--r);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:var(--ash);transition:.18s;
}
.rnav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.rnav span{font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.rnav:hover{color:var(--ink);background:var(--stone-2)}
.rnav.on{color:var(--ink);background:var(--clay-soft)}
.rail-foot{display:flex;flex-direction:column;gap:8px;align-items:center}
.lang-btn{
  border:1px solid var(--stone);border-radius:100px;padding:5px 0;width:46px;text-align:center;
  font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--ink);background:var(--chalk);transition:.18s;
}
.lang-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- page shell ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:34px 34px 90px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:26px}
.page-title{font-family:var(--display);font-size:clamp(30px,4.4vw,50px);line-height:1;margin:6px 0 0;font-weight:400}
.page-title em{font-style:italic;color:var(--clay)}
.page-sub{color:var(--ash);font-size:13px;margin-top:9px;max-width:52ch}
.head-tools{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:100px;
  padding:9px 18px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;transition:.18s;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.btn:hover{background:var(--clay);border-color:var(--clay)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--stone)}
.btn.ghost:hover{background:var(--chalk);border-color:var(--ink);color:var(--ink)}
.btn.sm{padding:6px 13px;font-size:10px}
.btn.danger:hover{background:var(--brick);border-color:var(--brick);color:#fff}
:lang(zh) .btn{letter-spacing:.06em}

/* ---------- filter bar ---------- */
.filters{background:var(--chalk);border:1px solid var(--stone);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:22px}
.filter-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{
  flex:1;min-width:190px;display:flex;align-items:center;gap:9px;
  border-bottom:1px solid var(--stone);padding:6px 2px;
}
.search:focus-within{border-color:var(--ink)}
.search svg{width:15px;height:15px;stroke:var(--ash);fill:none;stroke-width:1.5}
.search input{border:none;background:none;outline:none;width:100%;font-size:14px}
.search input::placeholder{color:var(--ash-2)}
.sortsel{border:1px solid var(--stone);border-radius:100px;padding:7px 12px;font-size:11px;background:var(--chalk);letter-spacing:.05em}
.frow{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-top:1px dashed var(--stone);flex-wrap:wrap}
.frow-label{width:74px;flex:none;padding-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{
  border:1px solid var(--stone);border-radius:100px;padding:5px 12px;font-size:11.5px;
  color:var(--ink-2);background:var(--chalk);transition:.15s;letter-spacing:.02em;
}
.chip:hover{border-color:var(--ash)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .c{opacity:.5;margin-left:5px;font-size:10px}
.filter-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;padding-top:11px;border-top:1px solid var(--stone);flex-wrap:wrap}
.result-count{font-size:12px;color:var(--ash)}
.result-count b{color:var(--ink);font-weight:600}

/* ---------- wardrobe grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px}
.card{
  background:var(--chalk);border:1px solid var(--stone);border-radius:var(--r-lg);overflow:hidden;
  display:flex;flex-direction:column;transition:.22s ease;position:relative;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--ash-2)}
.swatch{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--stone-2)}
.swatch img{width:100%;height:100%;object-fit:cover;display:block}
.swatch svg{width:100%;height:100%;display:block}
.swatch .badge{
  position:absolute;top:9px;left:9px;background:rgba(255,255,255,.9);backdrop-filter:blur(4px);
  border-radius:100px;padding:3px 9px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-2);
}
.swatch .stars{position:absolute;bottom:8px;left:9px;font-size:10px;letter-spacing:1px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.swatch .zero{position:absolute;top:9px;right:9px;background:var(--brick);color:#fff;font-size:9px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:100px}
.card-body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.card-name{font-family:var(--display);font-size:15.5px;line-height:1.25}
.card-meta{font-size:10.5px;color:var(--ash);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.ledger{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--stone);padding-top:8px;margin-top:auto}
.ledger div{display:flex;flex-direction:column;gap:1px}
.ledger .k{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash-2);font-weight:700}
.ledger .v{font-size:13px;font-weight:600}
.ledger .v.good{color:var(--sage)} .ledger .v.bad{color:var(--brick)}
.card-acts{display:flex;gap:5px;margin-top:2px}
.iact{
  flex:1;border:1px solid var(--stone);border-radius:var(--r);padding:6px 4px;font-size:10px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);transition:.15s;background:var(--chalk);
}
.iact:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.iact.wear:hover{background:var(--sage);border-color:var(--sage)}
.iact.del:hover{background:var(--brick);border-color:var(--brick)}

/* ---------- empty state ---------- */
.empty{border:1px dashed var(--stone);border-radius:var(--r-lg);padding:56px 24px;text-align:center;background:var(--chalk)}
.empty h3{font-family:var(--display);font-size:24px;font-weight:400;margin:0 0 6px}
.empty p{color:var(--ash);margin:0 0 16px;font-size:13px}

/* ---------- outfit studio ---------- */
.studio{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px;align-items:start}
.panel{background:var(--chalk);border:1px solid var(--stone);border-radius:var(--r-lg);padding:20px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-head h2{font-family:var(--display);font-size:22px;font-weight:400;margin:0}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.slot{
  border:1px dashed var(--stone);border-radius:var(--r);aspect-ratio:4/5;overflow:hidden;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--paper);transition:.18s;
}
.slot:hover{border-color:var(--clay);background:var(--clay-soft)}
.slot.filled{border-style:solid;border-color:var(--stone);background:var(--chalk);padding:0}
.slot .plus{font-size:19px;color:var(--ash-2);font-weight:300;line-height:1}
.slot .sl{font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ash);font-weight:700;text-align:center;padding:0 4px}
.slot img,.slot svg{width:100%;height:100%;object-fit:cover;display:block}
.slot .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.93);padding:4px 6px;
  font-size:9.5px;line-height:1.25;text-align:center;font-weight:600;border-top:1px solid var(--stone)}
.slot .x{position:absolute;top:5px;right:5px;background:rgba(28,26,23,.82);color:#fff;width:19px;height:19px;
  border-radius:100px;font-size:12px;line-height:19px;text-align:center}
.look-sum{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--stone)}
.look-sum div{display:flex;flex-direction:column}
.look-sum .k{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ash);font-weight:700}
.look-sum .v{font-family:var(--display);font-size:23px}
.save-row{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}
.save-row input{flex:1;min-width:150px;border:1px solid var(--stone);border-radius:100px;padding:9px 15px;background:var(--paper);outline:none}
.save-row input:focus{border-color:var(--ink);background:var(--chalk)}

.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}
.look{background:var(--chalk);border:1px solid var(--stone);border-radius:var(--r-lg);overflow:hidden;transition:.2s}
.look:hover{box-shadow:var(--shadow);border-color:var(--ash-2)}
.look-strip{display:flex;height:112px;background:var(--stone-2)}
.look-strip>*{flex:1;min-width:0;border-right:1px solid rgba(255,255,255,.55)}
.look-strip>*:last-child{border-right:none}
.look-strip img,.look-strip svg{width:100%;height:100%;object-fit:cover;display:block}
.look-info{padding:11px 13px 13px}
.look-info h4{font-family:var(--display);font-size:16.5px;font-weight:400;margin:0 0 3px}
.look-info .m{font-size:10.5px;color:var(--ash);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.look-acts{display:flex;gap:5px;margin-top:10px}

/* ---------- analytics ---------- */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:15px;margin-bottom:22px}
.stat{background:var(--chalk);border:1px solid var(--stone);border-radius:var(--r-lg);padding:16px 17px}
.stat .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);font-weight:700}
.stat .v{font-family:var(--display);font-size:33px;line-height:1.1;margin-top:7px}
.stat .s{font-size:11px;color:var(--ash);margin-top:4px}
.stat .v.over{color:var(--brick)} .stat .v.ok{color:var(--sage)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:20px;margin-bottom:20px}
.bar-item{margin-bottom:13px}
.bar-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;gap:10px}
.bar-top .lb{font-weight:600}
.bar-top .rt{color:var(--ash);font-variant-numeric:tabular-nums;font-size:11.5px}
.track{height:7px;background:var(--stone-2);border-radius:100px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:100px;background:var(--clay);transition:width .6s cubic-bezier(.2,.7,.3,1)}
.fill.ok{background:var(--sage)} .fill.warn{background:var(--amber)} .fill.over{background:var(--brick)}
.cap-line{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink);opacity:.35}
.alerts{display:flex;flex-direction:column;gap:9px}
.alert{display:flex;gap:11px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--stone);background:var(--paper);align-items:flex-start}
.alert .dot{width:7px;height:7px;border-radius:100px;margin-top:6px;flex:none;background:var(--ash)}
.alert.over{border-color:#E3C4BC;background:#FCF4F2} .alert.over .dot{background:var(--brick)}
.alert.warn{border-color:#E8D9BB;background:#FCF8F0} .alert.warn .dot{background:var(--amber)}
.alert.good{border-color:#CFD8C8;background:#F5F8F2} .alert.good .dot{background:var(--sage)}
.alert h5{margin:0 0 2px;font-size:12.5px;font-weight:700}
.alert p{margin:0;font-size:12px;color:var(--ink-2);line-height:1.5}
.donut-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:124px;height:124px;border-radius:100px;flex:none;display:grid;place-items:center;position:relative}
.donut::after{content:"";position:absolute;inset:19px;background:var(--chalk);border-radius:100px}
.donut .mid{position:relative;z-index:1;text-align:center}
.donut .mid b{font-family:var(--display);font-size:21px;display:block;line-height:1}
.donut .mid span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);font-weight:700}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:150px}
.leg{display:flex;align-items:center;gap:9px;font-size:12.5px}
.leg i{width:10px;height:10px;border-radius:2px;flex:none}
.leg .amt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ash)}
.rank{display:flex;flex-direction:column}
.rank-i{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--stone)}
.rank-i:last-child{border-bottom:none}
.rank-i .th{width:38px;height:47px;border-radius:3px;overflow:hidden;flex:none;background:var(--stone-2)}
.rank-i .th img,.rank-i .th svg{width:100%;height:100%;object-fit:cover;display:block}
.rank-i .nm{flex:1;min-width:0}
.rank-i .nm b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-i .nm span{font-size:10.5px;color:var(--ash)}
.rank-i .val{font-family:var(--display);font-size:17px;text-align:right}
.rank-i .val small{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);font-weight:700}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(28,26,23,.42);backdrop-filter:blur(3px);z-index:100;display:none;
  align-items:center;justify-content:center;padding:20px}
.scrim.open{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--paper);border-radius:var(--r-lg);width:100%;max-width:660px;max-height:90vh;overflow:auto;
  box-shadow:0 30px 80px -20px rgba(28,26,23,.4);animation:rise .24s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--stone);
  position:sticky;top:0;background:var(--paper);z-index:2}
.modal-head h3{font-family:var(--display);font-size:24px;font-weight:400;margin:0}
.close{width:32px;height:32px;border-radius:100px;border:1px solid var(--stone);font-size:16px;line-height:1;color:var(--ash)}
.close:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.modal-body{padding:22px 24px 26px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);font-weight:700}
.field input,.field select{border:1px solid var(--stone);border-radius:var(--r);padding:10px 12px;background:var(--chalk);outline:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--ink)}
.field input[type=color]{padding:3px;height:42px;cursor:pointer}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--stone);background:var(--chalk);border-radius:100px;padding:7px 13px;font-size:11.5px;transition:.15s}
.seg button:hover{border-color:var(--ash)}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.starpick{display:flex;gap:3px;font-size:22px;color:var(--stone);line-height:1}
.starpick button{color:var(--stone);transition:.12s;font-size:22px}
.starpick button.on{color:var(--clay)}
.upload{display:flex;gap:14px;align-items:flex-start}
.preview{width:84px;height:105px;border-radius:var(--r);border:1px solid var(--stone);overflow:hidden;flex:none;background:var(--stone-2);position:relative}
.preview img,.preview svg{width:100%;height:100%;object-fit:cover;display:block}
.preview.busy::after{
  content:"";position:absolute;inset:0;background:rgba(247,245,241,.82);
  background-image:radial-gradient(circle at 50% 46%,transparent 9px,transparent 9px);
}
.spin{position:absolute;left:50%;top:46%;width:20px;height:20px;margin:-10px 0 0 -10px;z-index:2;
  border:2px solid var(--stone);border-top-color:var(--clay);border-radius:100px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* file input: kept in the layout (not display:none) so iOS Safari opens it reliably */
.file-in{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.upl{
  display:flex !important;align-items:center;justify-content:center;gap:9px;width:100%;min-height:46px;
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:100px;padding:11px 18px;
  font-size:12px !important;letter-spacing:.11em !important;text-transform:uppercase !important;font-weight:600 !important;
  cursor:pointer;transition:.18s;-webkit-user-select:none;user-select:none;
}
.upl:hover{background:var(--clay);border-color:var(--clay)}
.upl:active{transform:scale(.985)}
.file-in:focus-visible+.upl{outline:2px solid var(--clay);outline-offset:2px}
.upl svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.upl.busy{background:var(--ash);border-color:var(--ash);pointer-events:none}
:lang(zh) .upl{letter-spacing:.05em !important;text-transform:none !important;font-size:13px !important}
.upl-row{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.upl-sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meter{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.meter .track{height:4px}
.meter .lbl{font-size:10px;color:var(--ash);display:flex;justify-content:space-between;gap:8px}
.meter .lbl b{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding-top:20px;margin-top:20px;border-top:1px solid var(--stone);flex-wrap:wrap}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:11px}
.pick{border:1px solid var(--stone);border-radius:var(--r);overflow:hidden;background:var(--chalk);text-align:left;transition:.16s}
.pick:hover{border-color:var(--ink);transform:translateY(-2px)}
.pick .ph{aspect-ratio:4/5;background:var(--stone-2)}
.pick .ph img,.pick .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.pick .nb{padding:6px 8px 8px;font-size:11px;line-height:1.3;font-weight:600}
.pick .nb i{display:block;font-style:normal;font-weight:500;color:var(--ash);font-size:10px;margin-top:2px}

/* ---------- toast + mobile nav ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);background:var(--ink);color:var(--paper);
  padding:11px 20px;border-radius:100px;font-size:12.5px;z-index:200;opacity:0;pointer-events:none;transition:.26s;letter-spacing:.02em}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mobnav{display:none}
.hint{font-size:11px;color:var(--ash);margin-top:6px}

@media(max-width:900px){
  .studio{grid-template-columns:1fr}
}
@media(max-width:720px){
  body{padding-left:0;padding-bottom:66px}
  .rail{
    inset:auto 0 0 0;width:100%;height:auto;flex-direction:row;border-right:none;border-top:1px solid var(--stone);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;z-index:90;
  }
  .mark{display:none}
  .rail-nav{margin:0;flex-direction:row;gap:2px;justify-content:space-around}
  .rnav{width:auto;flex:1;height:48px;min-width:56px}
  .rail-nav{flex:1}
  /* language button becomes a fourth tab instead of being pushed off-screen */
  .rail-foot{flex-direction:row;position:static;flex:0 0 auto;padding-left:6px;margin-left:2px;border-left:1px solid var(--stone)}
  .lang-btn{width:52px;height:48px;padding:0;border-radius:var(--r);border-color:transparent;background:transparent;
    font-size:13px;letter-spacing:.06em;color:var(--ash);display:flex;align-items:center;justify-content:center}
  .lang-btn:active{background:var(--clay-soft);color:var(--ink)}
  .wrap{padding:22px 16px 40px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .slots{grid-template-columns:repeat(3,1fr);gap:8px}
  .form-grid{grid-template-columns:1fr}
  .frow-label{width:100%}
  .modal{max-height:94vh}
  /* iOS Safari zooms the page when a focused control is under 16px */
  .field input,.field select,.search input,.save-row input,.sortsel{font-size:16px}
  .upl{min-height:52px}
  .preview{width:96px;height:120px}
  .iact{padding:9px 4px}
  .close{width:38px;height:38px}
}

      file works both when opened locally and inside sandboxed viewers.
   ====================================================================== */
const KEY="wardrobe66.v1";
let memoryOnly=false, mem={};
const store={
  read(){
    try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}
    catch(e){memoryOnly=true;return mem[KEY]||null;}
  },
  write(o){
    mem[KEY]=o;
    let payload;
    try{payload=JSON.stringify(o);}catch(e){return false;}
    lastBytes=payload.length;
    try{localStorage.setItem(KEY,payload);return true;}
    catch(e){
      // QuotaExceededError vs. storage being unavailable altogether
      const quota=e&&(e.name==="QuotaExceededError"||e.code===22||e.code===1014);
      if(quota){lastQuotaFail=true;return false;}
      if(!memoryOnly){memoryOnly=true;toast(t("msg.memoryOnly"));}
      return false;
    }
  }
};
let lastBytes=0, lastQuotaFail=false;
const STORAGE_CAP=4.6*1024*1024; // conservative slice of Safari's ~5MB origin quota
function bytesLabel(b){
  return b>=1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";

function tone(hex,amt){
  const h=(hex||"#cccccc").replace("#","");
  const f=h.length===3?h.split("").map(c=>c+c).join(""):h;
  const n=parseInt(f,16);
  let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return "rgb("+r+","+g+","+b+")";
}
function silhouette(it){
  const c=it.color||"#CFC8BC", id="g"+Math.random().toString(36).slice(2,8);
  const extra=it.cat==="bag"?'<path d="M38 44 Q50 20 62 44" fill="none" stroke="'+tone(c,-46)+'" stroke-width="2.6"/>':
              it.cat==="outer"?'<path d="M50 25 L50 106" fill="none" stroke="'+tone(c,-46)+'" stroke-width="1.6" opacity=".7"/>':
              it.cat==="shoe"?'<path d="M28 52 L44 52 L53 65" fill="none" stroke="'+tone(c,-46)+'" stroke-width="1.6" opacity=".7"/>':"";
  return '<svg viewBox="0 0 100 120" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+tone(c,14)+'"/><stop offset="100%" stop-color="'+tone(c,-16)+'"/>'+
    '</linearGradient></defs>'+
    '<rect width="100" height="120" fill="#EFEBE4"/>'+
    '<path d="'+PATHS[it.cat]+'" fill="url(#'+id+')" stroke="'+tone(c,-52)+'" stroke-width="1.1" stroke-linejoin="round"/>'+
    extra+'</svg>';
}
function thumb(it){
  if(!it)return "";
  return it.photo?'<img src="'+esc(it.photo)+'" alt="'+esc(nameOf(it))+'" loading="lazy">':silhouette(it);
}

function filtered(){
  const f=S.filters,q=f.q.trim().toLowerCase();
  let list=S.items.filter(it=>{
    if(q){
      const hay=((it.name.en||"")+" "+(it.name.zh||"")).toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    if(f.cat.length&&f.cat.indexOf(it.cat)<0)return false;
    if(f.season.length&&f.season.indexOf(it.season)<0)return false;
    if(f.occ.length&&f.occ.indexOf(it.occ)<0)return false;
    if(f.life.length&&f.life.indexOf(it.life)<0)return false;
    if(f.rating.length&&f.rating.indexOf(String(it.rating))<0)return false;
    return true;
  });
  const big=1e12;
  const sorts={
    recent:(a,b)=>b.added-a.added,
    priceHi:(a,b)=>b.price-a.price,
    priceLo:(a,b)=>a.price-b.price,
    cpwLo:(a,b)=>(cpw(a)==null?big:cpw(a))-(cpw(b)==null?big:cpw(b)),
    cpwHi:(a,b)=>(cpw(b)==null?big:cpw(b))-(cpw(a)==null?big:cpw(a)),
    worn:(a,b)=>b.wears-a.wears,
    rating:(a,b)=>b.rating-a.rating||b.wears-a.wears
  };
  return list.sort(sorts[f.sort]||sorts.recent);
}
function countBy(key,val){return S.items.filter(i=>String(i[key])===String(val)).length;}

function bar(label,n,cap,forceClay){
  const pct=cap?Math.min(100,n/cap*100):0;
  const cls=forceClay?"":(n>cap?"over":n>=cap*.85?"warn":"ok");
  const right=cap?(n>cap?t("an.over",{n:n-cap}):n===cap?t("an.full"):t("an.slot",{n:cap-n})):n;
  return '<div class="bar-item"><div class="bar-top"><span class="lb">'+esc(label)+'</span>'+
    '<span class="rt">'+(cap?n+" / "+cap+" · "+right:n)+'</span></div>'+
    '<div class="track"><div class="fill '+cls+'" style="width:'+pct+'%"></div></div></div>';
}

  const value=items.reduce((a,i)=>a+i.price,0);
  const worn=items.filter(i=>i.wears>0);
  const avgCpw=worn.length?worn.reduce((a,i)=>a+i.price/i.wears,0)/worn.length:0;
  const unworn=items.filter(i=>i.wears===0);
  const unwornVal=unworn.reduce((a,i)=>a+i.price,0);
  const longVal=items.filter(i=>i.life==="long").reduce((a,i)=>a+i.price,0);
  const shortVal=value-longVal;
  const shortPct=value?Math.round(shortVal/value*100):0;
  const longPct=100-shortPct;

  const catCount={};CATS.forEach(c=>catCount[c]=countBy("cat",c));
  const seasonMax=Math.max(1,...SEASONS.map(s=>countBy("season",s)));
  const occMax=Math.max(1,...OCCASIONS.map(o=>countBy("occ",o)));
  const ratingMax=Math.max(1,...[5,4,3,2,1].map(r=>countBy("rating",r)));

  const kpis='<div class="stat-row">'+
    '<div class="stat"><div class="k">'+esc(t("an.total"))+'</div>'+
      '<div class="v num '+(n>TOTAL_TARGET?"over":n<=TOTAL_TARGET?"ok":"")+'">'+n+'</div>'+
      '<div class="s">'+t("an.ofTarget",{n:TOTAL_TARGET})+'</div></div>'+
    '<div class="stat"><div class="k">'+esc(t("an.value"))+'</div><div class="v num">'+money(value)+'</div>'+
      '<div class="s">'+t("st.pieceCount",{n:n})+'</div></div>'+
    '<div class="stat"><div class="k">'+esc(t("an.avgCpw"))+'</div><div class="v num">'+(worn.length?money2(avgCpw):"—")+'</div>'+
      '<div class="s">'+esc(t("an.avgCpwSub"))+'</div></div>'+
    '<div class="stat"><div class="k">'+esc(t("an.unworn"))+'</div>'+
      '<div class="v num'+(unworn.length?" over":"")+'">'+unworn.length+'</div>'+
      '<div class="s">'+t("an.unwornSub",{v:money(unwornVal)})+'</div></div>'+
  '</div>';

  const catPanel='<div class="panel"><div class="panel-head"><h2>'+esc(t("an.byCat"))+'</h2></div>'+
    bar(t("an.total"),n,TOTAL_TARGET)+
    '<div style="height:9px"></div>'+
    CATS.map(c=>bar(t("cat."+c),catCount[c],TARGETS[c])).join("")+'</div>';

  const distPanel='<div class="panel"><div class="panel-head"><h2>'+esc(t("an.bySeason"))+'</h2></div>'+
    SEASONS.map(s=>simpleBar(t("s."+s),countBy("season",s),seasonMax,"var(--clay)")).join("")+
    '<div class="panel-head" style="margin-top:20px"><h2>'+esc(t("an.byOcc"))+'</h2></div>'+
    OCCASIONS.map(o=>simpleBar(t("o."+o),countBy("occ",o),occMax,"var(--sage)")).join("")+
    '<div class="panel-head" style="margin-top:20px"><h2>'+esc(t("an.byRating"))+'</h2></div>'+
    [5,4,3,2,1].map(r=>simpleBar(t("r."+r),countBy("rating",r),ratingMax,r>=4?"var(--sage)":r===3?"var(--amber)":"var(--brick)")).join("")+
  '</div>';

  const moneyPanel='<div class="panel"><div class="panel-head"><h2>'+esc(t("an.money"))+'</h2></div>'+
    '<div class="donut-row"><div class="donut" style="background:conic-gradient(var(--clay) 0 '+longPct+'%, var(--amber) '+longPct+'% 100%)">'+
      '<div class="mid"><b>'+longPct+'%</b><span>'+esc(t("l.long.short"))+'</span></div></div>'+
      '<div class="legend">'+
        '<div class="leg"><i style="background:var(--clay)"></i>'+esc(t("an.invest"))+'<span class="amt num">'+money(longVal)+'</span></div>'+
        '<div class="leg"><i style="background:var(--amber)"></i>'+esc(t("an.fast"))+'<span class="amt num">'+money(shortVal)+'</span></div>'+
        '<div class="leg" style="border-top:1px dashed var(--stone);padding-top:9px"><i style="background:var(--ink)"></i>'+
          esc(t("an.value"))+'<span class="amt num">'+money(value)+'</span></div>'+
      '</div></div>'+
    '<div class="panel-head" style="margin-top:22px"><h2>'+esc(t("an.best"))+'</h2></div>'+
    rankList(worn.slice().sort((a,b)=>a.price/a.wears-b.price/b.wears).slice(0,5))+
    '<div class="panel-head" style="margin-top:18px"><h2>'+esc(t("an.worst"))+'</h2></div>'+

  '</div>';

  /* --- warnings --- */
  const alerts=[];
  CATS.forEach(c=>{
    const v=catCount[c],cap=TARGETS[c];
    if(v>cap)alerts.push({k:"over",h:t("an.alertOver",{cat:t("cat."+c)}),p:t("an.alertOverBody",{n:v,t:cap,d:v-cap})});
    else if(v>=Math.ceil(cap*.85)&&v<=cap)alerts.push({k:"warn",h:t("an.alertNear",{cat:t("cat."+c)}),p:t("an.alertNearBody",{n:v,t:cap,d:cap-v})});
  });
  if(n>TOTAL_TARGET)alerts.push({k:"over",h:t("an.alertTotal"),p:t("an.alertTotalBody",{n:n})});
  if(shortPct>25)alerts.push({k:"warn",h:t("an.alertFast",{p:shortPct}),p:t("an.alertFastBody",{v:money(shortVal)})});
  const regret=items.filter(i=>i.rating<=2);
  if(regret.length)alerts.push({k:"over",h:t("an.alertDonate",{n:regret.length}),
    p:t("an.alertDonateBody",{v:money(regret.reduce((a,i)=>a+i.price,0)),w:Math.round(regret.reduce((a,i)=>a+i.wears,0)/regret.length*10)/10})});
  if(unworn.length)alerts.push({k:"warn",h:t("an.alertUnworn",{n:unworn.length}),p:t("an.alertUnwornBody",{v:money(unwornVal)})});
  if(!alerts.length)alerts.push({k:"good",h:t("an.alertClear"),p:t("an.alertClearBody")});

  const alertPanel='<div class="panel"><div class="panel-head"><h2>'+esc(t("an.alerts"))+'</h2></div>'+
    '<div class="alerts">'+alerts.map(a=>'<div class="alert '+a.k+'"><span class="dot"></span><div><h5>'+esc(a.h)+'</h5><p>'+esc(a.p)+'</p></div></div>').join("")+'</div></div>';

  return head("an.eyebrow","an.title","an.sub","")+kpis+
    '<div class="cols">'+catPanel+distPanel+'</div>'+
    '<div class="cols">'+moneyPanel+alertPanel+'</div>';
}

/* ======================================================================
   10. IMAGE HANDLING (downscaled so localStorage survives)
   ====================================================================== */
const PHOTO_MAX_PX=900;          // long edge after downscale
const PHOTO_BUDGET=230000;       // data-URL characters ≈ 168 KB on disk
const WEBP=(function(){
  try{const c=document.createElement("canvas");c.width=c.height=1;
      return c.toDataURL("image/webp").indexOf("data:image/webp")===0;}catch(e){return false;}
})();
const OUT_TYPE=WEBP?"image/webp":"image/jpeg";

/* Decode without ever holding a multi-megabyte base64 string in memory.
   createImageBitmap honours EXIF orientation, which matters for iPhone
   portrait shots; the <img>+objectURL path is the Safari 14 fallback. */
function decodeImage(file){
  if(window.createImageBitmap){
    const opts=createImageBitmap(file,{imageOrientation:"from-image"})
      .catch(()=>createImageBitmap(file))
      .catch(()=>decodeViaTag(file));
    return opts;
  }
  return decodeViaTag(file);
}
function decodeViaTag(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const im=new Image();
    im.decoding="async";
    im.onload=()=>{URL.revokeObjectURL(url);res(im);};
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("decode"));};
    im.src=url;
  });
}
function compressImage(file,cb,fail){
  decodeImage(file).then(src=>{
    const w=src.width||src.naturalWidth, h=src.height||src.naturalHeight;
    if(!w||!h)throw new Error("empty");
    let scale=Math.min(1,PHOTO_MAX_PX/Math.max(w,h));
    let cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale));
    const cv=document.createElement("canvas");
    const paint=()=>{
      cv.width=cw;cv.height=ch;
      const cx=cv.getContext("2d");
      cx.fillStyle="#EFEBE4";cx.fillRect(0,0,cw,ch);   // flatten alpha for JPEG
      cx.drawImage(src,0,0,cw,ch);
    };
    paint();
    let q=.82,out=cv.toDataURL(OUT_TYPE,q);
    // 1. walk quality down
    while(out.length>PHOTO_BUDGET&&q>.42){q-=.12;out=cv.toDataURL(OUT_TYPE,q);}
    // 2. then shrink pixels, for panoramas and 48MP camera files
    let guard=0;
    while(out.length>PHOTO_BUDGET&&Math.max(cw,ch)>380&&guard++<5){
      cw=Math.round(cw*.78);ch=Math.round(ch*.78);paint();
      out=cv.toDataURL(OUT_TYPE,q);
    }
    if(src.close)src.close();
    if(!out||out.length<64)throw new Error("encode");
    cb(out);
  }).catch(()=>{ if(fail)fail(); });
}

   11. ACTIONS
   ====================================================================== */
function wearItem(id,silent){
  const it=S.items.find(i=>i.id===id);if(!it)return;
  it.wears++;save();if(!silent){render();toast(t("msg.worn"));}
}
function delItem(id){
  if(!confirm(t("m.confirmDelete")))return;
  S.items=S.items.filter(i=>i.id!==id);
  S.outfits.forEach(o=>o.items=o.items.filter(x=>x!==id));
  SLOTS.forEach(s=>{if(S.builder[s]===id)delete S.builder[s];});
  save();render();toast(t("msg.deleted"));
}
function saveItem(){
  const nm=collectForm();
  if(!nm){$("#fName").focus();return;}
  if(draft._busy)return;               // still compressing
  delete draft._busy;
  const snapshot=S.items.slice();
  let msg;
  if(draft.id){
    const i=S.items.findIndex(x=>x.id===draft.id);
    if(i>=0)S.items[i]=draft;
    msg=t("msg.updated");
  }else{
    draft.id=uid();draft.added=Date.now();
    S.items.push(draft);msg=t("msg.added");
  }
  lastQuotaFail=false;
  const ok=save();
  if(!ok&&lastQuotaFail&&draft.photo&&draft.photo.slice(0,5)==="data:"){
    // Keep the piece, drop the photo, rather than losing the whole write.
    S.items=snapshot;draft.photo="";
    if(draft.id&&snapshot.some(x=>x.id===draft.id)){
      S.items=S.items.map(x=>x.id===draft.id?draft:x);
    }else{S.items.push(draft);}
    save();closeModal();render();toast(t("m.storageFull"));return;
  }
  closeModal();render();toast(msg);
}
function shuffle(){
  const pick=c=>{const p=S.items.filter(i=>i.cat===c);return p.length?p[Math.floor(Math.random()*p.length)].id:null;};
  S.builder={};
  const useDress=Math.random()<.35&&S.items.some(i=>i.cat==="dress");
  if(useDress)S.builder.dress=pick("dress");
  else{S.builder.top=pick("top");S.builder.bottom=pick("bottom");}
  S.builder.shoe=pick("shoe");
  if(Math.random()<.7)S.builder.outer=pick("outer");
  if(Math.random()<.7)S.builder.bag=pick("bag");
  if(Math.random()<.5)S.builder.acc=pick("acc");
  Object.keys(S.builder).forEach(k=>{if(!S.builder[k])delete S.builder[k];});
  save();render();toast(t("msg.shuffled"));
}
function saveLook(){
  const input=$("#lookName");
  const name=(input&&input.value||"").trim();
  const ids=builderItems().map(i=>i.id);
  if(ids.length<2){toast(t("st.needItems"));return;}
  if(!name){toast(t("st.needName"));if(input)input.focus();return;}
  S.outfits.push({id:uid(),name:name,items:ids,created:Date.now()});
  save();render();toast(t("st.saved"));
}
function wearLook(id){
  const o=S.outfits.find(x=>x.id===id);if(!o)return;
  let c=0;o.items.forEach(iid=>{const it=S.items.find(i=>i.id===iid);if(it){it.wears++;c++;}});
  save();render();toast(t("st.worn",{n:c}));
}
function loadLook(id){
  const o=S.outfits.find(x=>x.id===id);if(!o)return;
  S.builder={};
  o.items.forEach(iid=>{const it=S.items.find(i=>i.id===iid);if(it)S.builder[it.cat]=it.id;});
  save();render();window.scrollTo({top:0,behavior:"smooth"});
}
function exportData(){
  const blob=new Blob([JSON.stringify({app:"wardrobe66",items:S.items,outfits:S.outfits,currency:S.currency},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="wardrobe-66-"+new Date().toISOString().slice(0,10)+".json";
  a.click();URL.revokeObjectURL(a.href);toast(t("msg.exported"));
}
function importData(){
  const inp=document.createElement("input");inp.type="file";inp.accept="application/json";
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(fr.result);
        if(!d||!Array.isArray(d.items))throw 0;
        S.items=d.items;S.outfits=Array.isArray(d.outfits)?d.outfits:[];
        if(d.currency)S.currency=d.currency;
        S.builder={};save();render();toast(t("msg.imported"));
      }catch(e){toast(t("msg.badFile"));}
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* ======================================================================
   12. EVENT DELEGATION
   ====================================================================== */
document.addEventListener("click",e=>{
  const nav=e.target.closest(".rnav");
  if(nav){S.view=nav.dataset.view;save();render();return;}
  if(e.target.closest("#langBtn")){S.lang=S.lang==="en"?"zh":"en";save();closeModal();render();return;}

  const chip=e.target.closest(".chip");
  if(chip){
    const f=chip.dataset.f,v=chip.dataset.v,arr=S.filters[f];
    const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);
    save();render();return;
  }
  if(e.target.closest("#clearF")){
    S.filters={q:"",cat:[],season:[],occ:[],life:[],rating:[],sort:S.filters.sort};
    save();render();return;
  }
  const slotBtn=e.target.closest(".slot[data-slot]");
  if(slotBtn){pickerModal(slotBtn.dataset.slot);return;}
  const clr=e.target.closest("[data-clear]");
  if(clr){delete S.builder[clr.dataset.clear];save();render();return;}
  const choose=e.target.closest("[data-choose]");
  if(choose){S.builder[choose.dataset.slot]=choose.dataset.choose;save();closeModal();render();return;}
  const star=e.target.closest("[data-star]");
  if(star&&draft){draft.rating=Number(star.dataset.star);collectForm();paintForm();return;}
  const setter=e.target.closest("[data-set]");
  if(setter&&draft){collectForm();draft[setter.dataset.set]=setter.dataset.val;paintForm();return;}

  const btn=e.target.closest("[data-act]");
  if(!btn)return;
  const id=btn.dataset.id;
  switch(btn.dataset.act){
    case "add":itemForm(null);break;
    case "edit":itemForm(S.items.find(i=>i.id===id));break;
    case "wear":wearItem(id);break;
    case "del":delItem(id);break;
    case "close":closeModal();break;
    case "saveItem":saveItem();break;
    case "delFromForm":{const d=draft.id;closeModal();delItem(d);break;}
    case "dropPhoto":collectForm();draft.photo="";paintForm();break;
    case "shuffle":shuffle();break;
    case "clearCanvas":S.builder={};save();render();toast(t("msg.canvasCleared"));break;
    case "saveLook":saveLook();break;
    case "wearLook":wearLook(id);break;
    case "loadLook":loadLook(id);break;
    case "delLook":if(confirm(t("m.confirmLook"))){S.outfits=S.outfits.filter(o=>o.id!==id);save();render();toast(t("msg.lookDeleted"));}break;
    case "export":exportData();break;
    case "import":importData();break;
    case "reset":if(confirm(t("m.confirmReset"))){S.items=buildPreset();S.outfits=[];S.builder={};save();render();toast(t("msg.reset"));}break;
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="sort"){S.filters.sort=e.target.value;save();render();}
  if(e.target.id==="fFile"&&e.target.files&&e.target.files[0]&&draft){
    const file=e.target.files[0];
    collectForm();
    draft._busy=true;paintForm();
    compressImage(file,
      data=>{
        draft.photo=data;draft._busy=false;paintForm();
        toast(t("m.photoSaved",{v:bytesLabel(Math.round(data.length*.75))}));
      },
      ()=>{ draft._busy=false;paintForm();toast(t("m.badImage")); }
    );
    e.target.value="";  // lets the same photo be re-picked after a removal
  }
});
let qTimer;
document.addEventListener("input",e=>{
  if(e.target.id==="q"){
    clearTimeout(qTimer);
    const v=e.target.value;
    qTimer=setTimeout(()=>{
      S.filters.q=v;save();render();
      const q=$("#q");if(q){q.focus();q.setSelectionRange(v.length,v.length);}
    },260);
  }
});

/* ======================================================================
   13. GO
   ====================================================================== */
render();
if(memoryOnly)setTimeout(()=>toast(t("msg.memoryOnly")),700);

/* Offline support when served over HTTPS. Silently skipped when the file is
   opened directly from disk (file://), where service workers aren't allowed. */
if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
